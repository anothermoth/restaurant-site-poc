name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, lint, test, check menu, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Menu quality check (deterministic rules, no LLM in CI)
        # The sample menu has seeded problems on purpose, so report but don't fail here.
        run: npm run check-menu -- data/sample-restaurant.menu.json --fail-on none

      - name: Build site
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 7
